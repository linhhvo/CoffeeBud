# fly.toml app configuration file generated for coffeebud-client on 2026-05-05T16:56:26+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coffeebud-client'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  internal_port = 80
  protocol = "tcp"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256